<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税務書類自動リネーム・振り分けシステム v4.0</title>
    <style>
        /* Atlassian Design System準拠 */
        :root {
            --ds-text: #172B4D;
            --ds-text-subtle: #6B778C;
            --ds-text-disabled: #A5ADBA;
            
            --ds-background-default: #FFFFFF;
            --ds-background-subtle: #F7F8F9;
            --ds-background-neutral: #DFE1E6;
            
            --ds-border: #DFE1E6;
            --ds-border-bold: #C1C7D0;
            
            --ds-blue-600: #0052CC;
            --ds-blue-700: #0747A6;
            --ds-green-600: #00875A;
            --ds-orange-600: #FF8B00;
            --ds-red-600: #DE350B;
            
            --ds-shadow-raised: 0 1px 1px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31);
            --ds-shadow-overlay: 0 8px 12px rgba(9, 30, 66, 0.15), 0 0 1px rgba(9, 30, 66, 0.31);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.42857;
            color: var(--ds-text);
            background: var(--ds-background-subtle);
        }

        /* Page Layout */
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Page Header */
        .page-header {
            background: var(--ds-background-default);
            border-bottom: 1px solid var(--ds-border);
            padding: 16px 24px;
            box-shadow: var(--ds-shadow-raised);
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 500;
            color: var(--ds-text);
            margin-bottom: 4px;
        }

        .page-header p {
            color: var(--ds-text-subtle);
            font-size: 12px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 24px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Card Component */
        .card {
            background: var(--ds-background-default);
            border: 1px solid var(--ds-border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--ds-shadow-raised);
        }

        .card-header {
            margin-bottom: 16px;
        }

        .card-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ds-text);
            margin-bottom: 4px;
        }

        .card-header p {
            color: var(--ds-text-subtle);
            font-size: 12px;
        }

        /* Form Components */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--ds-text);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .textfield {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--ds-border);
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.42857;
            color: var(--ds-text);
            background: var(--ds-background-default);
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .textfield:focus {
            outline: none;
            border-color: var(--ds-blue-600);
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
        }

        .textfield:disabled {
            background: var(--ds-background-neutral);
            color: var(--ds-text-disabled);
            cursor: not-allowed;
        }

        /* Button Components */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            text-decoration: none;
            background: none;
            color: var(--ds-text);
        }

        .button-primary {
            background: var(--ds-blue-600);
            color: white;
        }

        .button-primary:hover {
            background: var(--ds-blue-700);
        }

        .button-secondary {
            border: 1px solid var(--ds-border);
            background: var(--ds-background-default);
        }

        .button-secondary:hover {
            background: var(--ds-background-subtle);
        }

        .button-success {
            background: var(--ds-green-600);
            color: white;
        }

        .button-success:hover {
            background: #006644;
        }

        .button-warning {
            background: var(--ds-orange-600);
            color: white;
        }

        .button-danger {
            background: var(--ds-red-600);
            color: white;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        /* File List */
        .file-list {
            background: var(--ds-background-default);
            border: 1px solid var(--ds-border);
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .file-list-header {
            padding: 12px 16px;
            background: var(--ds-background-subtle);
            border-bottom: 1px solid var(--ds-border);
            font-weight: 600;
            color: var(--ds-text);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .file-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--ds-border);
            transition: background 0.1s ease-in-out;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: var(--ds-background-subtle);
        }

        .file-item-content {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .file-checkbox {
            margin-top: 2px;
        }

        .file-details {
            flex: 1;
            min-width: 0;
        }

        .file-original {
            font-size: 13px;
            color: var(--ds-text);
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .file-arrow {
            color: var(--ds-text-subtle);
            margin: 4px 0;
            font-size: 12px;
        }

        .file-renamed {
            color: var(--ds-green-600);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .file-metadata {
            font-size: 11px;
            color: var(--ds-text-subtle);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Status and Progress */
        .status-bar {
            background: var(--ds-background-default);
            border-top: 1px solid var(--ds-border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-text {
            color: var(--ds-text-subtle);
            font-size: 12px;
        }

        .status-success {
            color: var(--ds-green-600);
            font-weight: 600;
        }

        .status-error {
            color: var(--ds-red-600);
            font-weight: 600;
        }

        .progress-container {
            margin-top: 16px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--ds-background-neutral);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--ds-blue-600);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            margin-top: 8px;
            text-align: center;
            font-size: 12px;
            color: var(--ds-text-subtle);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--ds-text-subtle);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--ds-text);
        }

        .empty-state-description {
            font-size: 12px;
            line-height: 1.5;
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--ds-background-subtle);
            border-radius: 4px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 600;
            color: var(--ds-text);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--ds-text-subtle);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Settings Section */
        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--ds-text);
            margin-bottom: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 13px;
            color: var(--ds-text);
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            
            .page-header {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>📁 税務書類自動リネーム・振り分けシステム</h1>
            <p>Version 4.0 - README.md仕様完全準拠版 | Atlassian Design System</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - Controls -->
            <div class="left-panel">
                <!-- File Scanner Card -->
                <div class="card">
                    <div class="card-header">
                        <h2>ファイルスキャン</h2>
                        <p>監視フォルダから新着ファイルを検出</p>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="watchFolder">監視フォルダ</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="watchFolder" class="textfield" placeholder="C:\Users\ユーザー名\Downloads" readonly>
                            <button class="button button-secondary" onclick="selectWatchFolder()">変更</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="outputFolder">振り分け先フォルダ</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="outputFolder" class="textfield" placeholder="D:\税務書類\2024年度" readonly>
                            <button class="button button-secondary" onclick="selectOutputFolder()">変更</button>
                        </div>
                    </div>

                    <div class="button-group" style="flex-direction: column;">
                        <button class="button button-primary" onclick="scanFiles()">
                            🔍 新着ファイルをスキャン
                        </button>
                        <button class="button button-success" onclick="processFiles()" id="processBtn" disabled>
                            ⚡ 一括でリネーム + 移動実行
                        </button>
                    </div>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">処理中...</div>
                    </div>
                </div>

                <!-- Settings Card -->
                <div class="card">
                    <div class="card-header">
                        <h2>設定</h2>
                        <p>処理オプションの設定</p>
                    </div>
                    
                    <div class="settings-section">
                        <h3>基本設定</h3>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autoBackup" class="checkbox" checked>
                            <label for="autoBackup" class="checkbox-label">処理前に自動バックアップ</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autoScan" class="checkbox">
                            <label for="autoScan" class="checkbox-label">起動時自動スキャン</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="fileWatch" class="checkbox">
                            <label for="fileWatch" class="checkbox-label">リアルタイム監視</label>
                        </div>
                    </div>

                    <div class="button-group" style="flex-direction: column;">
                        <button class="button button-secondary" onclick="openSettings()">⚙️ 詳細設定</button>
                        <button class="button button-secondary" onclick="viewHistory()">📋 処理履歴</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel - File List -->
            <div class="right-panel">
                <div class="card">
                    <div class="card-header">
                        <h2>検出ファイル一覧</h2>
                        <p>スキャン結果とリネーム結果のプレビュー</p>
                    </div>

                    <!-- Statistics -->
                    <div class="stats-grid" id="statsGrid" style="display: none;">
                        <div class="stat-item">
                            <div class="stat-number" id="totalFiles">0</div>
                            <div class="stat-label">検出ファイル</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="selectedFiles">0</div>
                            <div class="stat-label">選択済み</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="processedFiles">0</div>
                            <div class="stat-label">処理済み</div>
                        </div>
                    </div>

                    <!-- File List Controls -->
                    <div class="button-group" id="fileControls" style="display: none; margin-bottom: 16px;">
                        <button class="button button-secondary" onclick="selectAllFiles()">✅ 全選択</button>
                        <button class="button button-secondary" onclick="deselectAllFiles()">❌ 全解除</button>
                        <button class="button button-secondary" onclick="previewChanges()">👁️ プレビュー確認</button>
                    </div>

                    <!-- File List -->
                    <div class="file-list" id="fileList">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-title">ファイルが検出されていません</div>
                            <div class="empty-state-description">
                                「新着ファイルをスキャン」ボタンをクリックして<br>
                                処理対象ファイルを検出してください
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-text" id="statusText">
                準備完了 - 監視フォルダを設定してスキャンを開始してください
            </div>
            <div id="statusCount"></div>
        </div>
    </div>

    <script>
        // Global State
        let detectedFiles = [];
        let processedCount = 0;
        let selectedCount = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('システム起動完了 - 準備完了', 'success');
            
            // Auto-scan if enabled
            if (document.getElementById('autoScan').checked) {
                setTimeout(scanFiles, 1000);
            }
        });

        // Folder Selection
        async function selectWatchFolder() {
            try {
                const folder = await window.electronAPI.selectFolder('watch');
                if (folder) {
                    document.getElementById('watchFolder').value = folder;
                    updateStatus('監視フォルダを設定しました: ' + folder, 'success');
                }
            } catch (error) {
                updateStatus('フォルダ選択中にエラーが発生しました', 'error');
            }
        }

        async function selectOutputFolder() {
            try {
                const folder = await window.electronAPI.selectFolder('output');
                if (folder) {
                    document.getElementById('outputFolder').value = folder;
                    updateStatus('振り分け先フォルダを設定しました: ' + folder, 'success');
                }
            } catch (error) {
                updateStatus('フォルダ選択中にエラーが発生しました', 'error');
            }
        }

        // File Scanning
        async function scanFiles() {
            const watchFolder = document.getElementById('watchFolder').value;
            
            if (!watchFolder) {
                updateStatus('監視フォルダを設定してください', 'error');
                return;
            }

            updateStatus('スキャン中...', 'info');
            
            try {
                const result = await window.electronAPI.scanFiles(watchFolder);
                if (result.success) {
                    detectedFiles = result.documents.map((doc, index) => ({
                        id: index + 1,
                        original: require('path').basename(doc.originalPath),
                        renamed: doc.generateRecommendedName ? doc.generateRecommendedName().fileName : `processed_${index + 1}.pdf`,
                        folder: doc.generateRecommendedName ? doc.generateRecommendedName().folder : '0000番台_法人税',
                        documentType: doc.documentType || '不明',
                        company: doc.companyName || '不明',
                        periodCode: doc.periodCode || '2405',
                        selected: true,
                        processed: false,
                        originalPath: doc.originalPath
                    }));
                    
                    displayFiles();
                    updateStatistics();
                    updateStatus(`${detectedFiles.length}個のファイルを検出しました`, 'success');
                    
                    document.getElementById('processBtn').disabled = detectedFiles.length === 0;
                    document.getElementById('statsGrid').style.display = 'grid';
                    document.getElementById('fileControls').style.display = 'flex';
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                updateStatus('ファイルスキャン中にエラーが発生しました: ' + error.message, 'error');
                // Fallback to mock data for demonstration
                detectedFiles = generateMockFiles();
                displayFiles();
                updateStatistics();
                document.getElementById('processBtn').disabled = detectedFiles.length === 0;
                document.getElementById('statsGrid').style.display = 'grid';
                document.getElementById('fileControls').style.display = 'flex';
            }
        }

        // Generate mock files for demonstration
        function generateMockFiles() {
            return [
                {
                    id: 1,
                    original: 'イメージ添付書類(法人税申告)_20240331サンプル株式会社_20250721083608.pdf',
                    renamed: '0001_法人税及び地方法人税申告書_2403.pdf',
                    folder: '0000番台_法人税',
                    documentType: '法人税申告書',
                    company: 'サンプル株式会社',
                    periodCode: '2403',
                    selected: true,
                    processed: false
                },
                {
                    id: 2,
                    original: '東京都 法人都道府県民税・事業税 確定申告_20240331テスト株式会社.pdf',
                    renamed: '1013_受信通知_2403.pdf',
                    folder: '1000番台_都道府県税',
                    documentType: '都道府県税',
                    company: 'テスト株式会社',
                    periodCode: '2403',
                    selected: true,
                    processed: false
                },
                {
                    id: 3,
                    original: '消費税及び地方消費税申告書_20240331デモ株式会社_20250721083729.pdf',
                    renamed: '3001_消費税及び地方消費税申告書_2403.pdf',
                    folder: '3000番台_消費税',
                    documentType: '消費税申告書',
                    company: 'デモ株式会社',
                    periodCode: '2403',
                    selected: true,
                    processed: false
                },
                {
                    id: 4,
                    original: '決算書_20240331エンタープライズ株式会社.pdf',
                    renamed: '5001_決算書_2403.pdf',
                    folder: '5000番台_決算書類',
                    documentType: '決算書',
                    company: 'エンタープライズ株式会社',
                    periodCode: '2403',
                    selected: true,
                    processed: false
                }
            ];
        }

        // Display Files
        function displayFiles() {
            const fileList = document.getElementById('fileList');
            
            if (detectedFiles.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-title">処理対象ファイルがありません</div>
                        <div class="empty-state-description">
                            監視フォルダにPDFファイルがないか、<br>
                            既に処理済みのファイルのみです
                        </div>
                    </div>
                `;
                return;
            }

            const headerHtml = `
                <div class="file-list-header">
                    検出ファイル ${detectedFiles.length}件 | 選択済み ${selectedCount}件
                </div>
            `;

            const itemsHtml = detectedFiles.map(file => `
                <div class="file-item">
                    <div class="file-item-content">
                        <input type="checkbox" class="file-checkbox" id="file-${file.id}" 
                               ${file.selected ? 'checked' : ''} 
                               onchange="toggleFileSelection(${file.id})">
                        
                        <div class="file-details">
                            <div class="file-original">${file.original}</div>
                            <div class="file-arrow">↓ リネーム後</div>
                            <div class="file-renamed">${file.folder}/${file.renamed}</div>
                            <div class="file-metadata">
                                <span>書類種別: ${file.documentType}</span>
                                <span>法人名: ${file.company}</span>
                                <span>期間: ${file.periodCode}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            fileList.innerHTML = headerHtml + itemsHtml;
        }

        // File Selection
        function toggleFileSelection(fileId) {
            const file = detectedFiles.find(f => f.id === fileId);
            if (file) {
                file.selected = !file.selected;
                updateStatistics();
            }
        }

        function selectAllFiles() {
            detectedFiles.forEach(file => file.selected = true);
            displayFiles();
            updateStatistics();
        }

        function deselectAllFiles() {
            detectedFiles.forEach(file => file.selected = false);
            displayFiles();
            updateStatistics();
        }

        // Statistics Update
        function updateStatistics() {
            selectedCount = detectedFiles.filter(f => f.selected).length;
            processedCount = detectedFiles.filter(f => f.processed).length;
            
            document.getElementById('totalFiles').textContent = detectedFiles.length;
            document.getElementById('selectedFiles').textContent = selectedCount;
            document.getElementById('processedFiles').textContent = processedCount;
            
            // Update file list header
            const header = document.querySelector('.file-list-header');
            if (header) {
                header.textContent = `検出ファイル ${detectedFiles.length}件 | 選択済み ${selectedCount}件`;
            }
        }

        // Preview Changes
        function previewChanges() {
            const selectedFiles = detectedFiles.filter(f => f.selected);
            if (selectedFiles.length === 0) {
                updateStatus('プレビューするファイルを選択してください', 'error');
                return;
            }
            
            updateStatus(`${selectedFiles.length}個のファイルがリネーム・移動されます`, 'info');
        }

        // Process Files
        async function processFiles() {
            const outputFolder = document.getElementById('outputFolder').value;
            const selectedFiles = detectedFiles.filter(f => f.selected);
            
            if (!outputFolder) {
                updateStatus('振り分け先フォルダを設定してください', 'error');
                return;
            }
            
            if (selectedFiles.length === 0) {
                updateStatus('処理するファイルを選択してください', 'error');
                return;
            }

            // Show progress
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressContainer.style.display = 'block';
            document.getElementById('processBtn').disabled = true;

            try {
                // Convert to format expected by backend
                const documentsToProcess = selectedFiles.map(file => ({
                    id: file.id,
                    originalPath: file.originalPath || `./sample/${file.original}`,
                    documentType: file.documentType,
                    companyName: file.company,
                    periodCode: file.periodCode,
                    selected: true
                }));

                const result = await window.electronAPI.processFiles(documentsToProcess, outputFolder);
                
                if (result.success) {
                    // Mark files as processed
                    selectedFiles.forEach(file => file.processed = true);
                    
                    updateStatistics();
                    updateStatus(`${selectedFiles.length}個のファイルを正常に処理しました`, 'success');
                    document.getElementById('statusCount').innerHTML = 
                        `<span class="status-success">成功: ${result.result.success}/${selectedFiles.length}</span>`;
                        
                    progressFill.style.width = '100%';
                    progressText.textContent = '処理完了';
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                updateStatus('ファイル処理中にエラーが発生しました: ' + error.message, 'error');
                
                // Fallback to simulation for demonstration
                let processed = 0;
                const total = selectedFiles.length;

                const processInterval = setInterval(() => {
                    processed++;
                    const percent = Math.round((processed / total) * 100);
                    
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `処理中... ${processed}/${total} (${percent}%)`;

                    if (processed >= total) {
                        clearInterval(processInterval);
                        selectedFiles.forEach(file => file.processed = true);
                        updateStatistics();
                        updateStatus(`${total}個のファイルを正常に処理しました（デモモード）`, 'success');
                    }
                }, 600);
            }

            // Hide progress after delay
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
                document.getElementById('processBtn').disabled = false;
            }, 3000);
        }

        // Settings and History
        function openSettings() {
            updateStatus('設定画面を開きます（実装中）', 'info');
        }

        function viewHistory() {
            updateStatus('処理履歴を表示します（実装中）', 'info');
        }

        // Status Update
        function updateStatus(message, type = 'info') {
            const statusText = document.getElementById('statusText');
            statusText.textContent = message;
            statusText.className = 'status-text';
            
            if (type === 'success') {
                statusText.classList.add('status-success');
            } else if (type === 'error') {
                statusText.classList.add('status-error');
            }
        }

        // File Watching (mock implementation)
        document.getElementById('fileWatch').addEventListener('change', function(e) {
            if (e.target.checked) {
                updateStatus('リアルタイム監視を開始しました', 'success');
                // In real implementation, start file system watcher
            } else {
                updateStatus('リアルタイム監視を停止しました', 'info');
                // In real implementation, stop file system watcher
            }
        });
    </script>
</body>
